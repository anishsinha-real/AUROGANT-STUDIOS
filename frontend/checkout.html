<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — AURØGANT STUDIO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="logo" href="index.html">AURØGANT <span>STUDIO</span></a><a class="btn" href="cart.html">← Cart</a></div></header><main><section class="page-title"><div class="container"><div class="eyebrow">Checkout</div><h1>Let's Get Your Order Moving.</h1></div></section><section class="section" style="padding-top:10px"><div class="container"><form id="checkoutForm" class="form-card"><div id="checkoutNotice" class="notice" style="margin-bottom:20px">Your order details are secure and used only for fulfillment.</div><div class="form-grid"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>PIN Code *</label><input name="pincode" required></div><div class="field full"><label>Address *</label><textarea name="address" required></textarea></div><div class="field"><label>City *</label><input name="city" required></div><div class="field"><label>State *</label><input name="state" required></div><div class="field full"><label>Payment</label><select name="paymentMethod"><option value="cod">Pay on Order / COD</option><option value="online">Pay Online with Razorpay</option></select></div></div><div class="price-box" style="margin-top:22px"><div class="summary-row"><span>Subtotal</span><span id="coSubtotal">₹0</span></div><div class=

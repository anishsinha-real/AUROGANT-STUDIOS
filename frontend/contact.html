<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — AURØGANT STUDIO</title><link rel="stylesheet" href="css/main.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><header class="nav"><div class="container nav-inner"><a class="logo" href="index.html">AURØGANT <span>STUDIO</span></a><a class="btn" href="index.html">Home</a></div></header><main><section class="page-title"><div class="container"><div class="eyebrow">Support</div><h1>Talk to AURØGANT.</h1><p>Questions about designs, orders or delivery? Send us a message.</p></div></section><section class="section" style="padding-top:20px"><div class="container"><form class="form-card" id="contactForm"><div class="form-grid"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field full"><label>Phone</label><input name="phone"></div><div class="field full"><label>Message *</label><textarea name="message" required></textarea></div></div><button class="btn btn-gold" type="submit" style="margin-top:20px">Send Message</button><div id="contactResult" style="margin-top:15px"></div></form></div></section></main><div id="toast" class="toast"></div><script src="js/app.js"></script><script>document.getElementById('contactForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const r=await api('/content/contact',{method:'POST',body:JSON.stringify(data)});document.getElementById('contactResult').textContent=r?.message||'Message saved locally. We will get back to you.';e.currentTarget.reset()}</script></body></html>
